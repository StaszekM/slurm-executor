services:
  mysql:
    image: mariadb:10.11
    hostname: mysql
    container_name: mysql-test
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - var_lib_mysql_test:/var/lib/mysql
    networks:
      - slurm-network-test

  slurmdbd:
    image: slurm-docker-cluster:${SLURM_VERSION:-25.05.3}
    build:
      context: ../vendor/slurm-docker-cluster
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmdbd"]
    container_name: slurmdbd-test
    hostname: slurmdbd
    volumes:
      - etc_munge_test:/etc/munge
      - etc_slurm_test:/etc/slurm
      - var_log_slurm_test:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      - mysql
    networks:
      - slurm-network-test

  slurmctld:
    image: slurm-docker-cluster-ssh:${SLURM_VERSION}
    build:
      context: ..
      dockerfile: e2e/Dockerfile.ssh
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmctld"]
    container_name: slurmctld-test
    hostname: slurmctld
    volumes:
      - etc_munge_test:/etc/munge
      - etc_slurm_test:/etc/slurm
      - slurm_jobdir_test:/data
      - var_log_slurm_test:/var/log/slurm
      - ../vendor/slurm-docker-cluster/cgroup.conf:/etc/slurm/cgroup.conf
      - ./fixtures/test-workspace:/test-workspace
      # Mount project root for library testing
      - ../../:/workspace
    ports:
      - "2222:22"  # Expose SSH on host port 2222
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network-test

  c1:
    image: slurm-docker-cluster:${SLURM_VERSION}
    build:
      context: ../vendor/slurm-docker-cluster
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmd"]
    hostname: c1
    container_name: c1-test
    volumes:
      - etc_munge_test:/etc/munge
      - etc_slurm_test:/etc/slurm
      - slurm_jobdir_test:/data
      - var_log_slurm_test:/var/log/slurm
      - ../vendor/slurm-docker-cluster/cgroup.conf:/etc/slurm/cgroup.conf
      - ./fixtures/test-workspace:/test-workspace
      # Mount project root for library testing
      - ../../:/workspace
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network-test

  c2:
    image: slurm-docker-cluster:${SLURM_VERSION}
    build:
      context: ../vendor/slurm-docker-cluster
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmd"]
    hostname: c2
    container_name: c2-test
    volumes:
      - etc_munge_test:/etc/munge
      - etc_slurm_test:/etc/slurm
      - slurm_jobdir_test:/data
      - var_log_slurm_test:/var/log/slurm
      - ../vendor/slurm-docker-cluster/cgroup.conf:/etc/slurm/cgroup.conf
      - ./fixtures/test-workspace:/test-workspace
      # Mount project root for library testing
      - ../../:/workspace
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network-test

volumes:
  etc_munge_test:
  etc_slurm_test:
  slurm_jobdir_test:
  var_lib_mysql_test:
  var_log_slurm_test:

networks:
  slurm-network-test:
    driver: bridge
