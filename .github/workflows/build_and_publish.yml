name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'              # automatically build when any tag starting with 'v' is pushed

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12
        
      - name: Build
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  publish:
    name: Publish to PyPI (manual approval)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi          # <- this triggers the manual approval pause
      url: https://pypi.org/project/YOUR_PACKAGE_NAME/
    permissions:
      id-token: write     # needed for Trusted Publisher
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      
      - name: Publish to PyPI
        run: uv publish