name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'              # automatically build when any tag starting with 'v' is pushed
  workflow_dispatch:      # allows manual trigger (for publishing)

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')        # only build when tag is pushed
    outputs:
      artifact_name: dist-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12
        
      - name: Build
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}    # only manual
    environment:
      name: pypi
    permissions:
      id-token: write      # for trusted publisher
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      
      - name: Publish to PyPI
        run: uv publish