name: "E2E Smoke Tests"

on:
  # Run on pull requests to main branch
  pull_request:
    branches: [main]
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  e2e-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch submodules (needed for slurm-docker-cluster)
          submodules: recursive
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Sync Python environment
        run: uv sync
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build slurm-docker-cluster image
        working-directory: tests/e2e
        run: make build
      
      - name: Run E2E smoke tests
        working-directory: tests/e2e
        run: make test-smoke
        env:
          CI: true
      
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slurm-container-logs
          path: tests/e2e/logs/
          retention-days: 7
      
      - name: Upload test workspace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-workspace-output
          path: tests/e2e/fixtures/test-workspace/outputs/
          retention-days: 7
      
      - name: Clean up containers
        if: always()
        working-directory: tests/e2e
        run: make clean