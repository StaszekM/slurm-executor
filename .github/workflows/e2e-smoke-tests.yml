name: "E2E Smoke Tests"

on:
  # Run on pull requests to main branch
  pull_request:
    branches: [main]
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  e2e-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch submodules (needed for slurm-docker-cluster)
          submodules: recursive
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Sync Python environment
        run: uv sync
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load environment variables
        working-directory: tests/e2e
        run: |
          # Load environment variables from .env.test
          set -a
          source .env.test
          set +a
          echo "SLURM_TAG=${SLURM_TAG}" >> $GITHUB_ENV
          echo "SLURM_VERSION=${SLURM_VERSION}" >> $GITHUB_ENV

      # Use actions/cache for Docker layers as workaround for load+gha cache issue
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-slurm-${{ env.SLURM_TAG }}-${{ hashFiles('tests/vendor/slurm-docker-cluster/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-slurm-${{ env.SLURM_TAG }}-
            ${{ runner.os }}-buildx-slurm-

      - name: Build slurm-docker-cluster image with cache
        uses: docker/build-push-action@v5
        with:
          context: tests/vendor/slurm-docker-cluster
          file: tests/vendor/slurm-docker-cluster/Dockerfile
          build-args: |
            SLURM_TAG=${{ env.SLURM_TAG }}
          tags: slurm-docker-cluster:${{ env.SLURM_VERSION }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for actions/cache buildx cache size issue
      # https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify Docker image
        run: |
          echo "✅ Docker image built successfully"
          docker images | grep slurm-docker-cluster
          echo "Image size: $(docker images slurm-docker-cluster:${{ env.SLURM_VERSION }} --format 'table {{.Size}}')"
      
      - name: Run E2E smoke tests
        working-directory: tests/e2e
        run: make test-smoke
        env:
          CI: true
      
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slurm-container-logs
          path: tests/e2e/logs/
          retention-days: 7
      
      - name: Upload test workspace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-workspace-output
          path: tests/e2e/fixtures/test-workspace/outputs/
          retention-days: 7
      
      - name: Clean up containers
        if: always()
        working-directory: tests/e2e
        run: make clean