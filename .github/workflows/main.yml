name: "Test and lint"

on:
  push:
    branches:
      - 'dev'
      - 'main'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync env
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest
    
